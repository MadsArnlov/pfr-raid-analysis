name: Nightly FFLogs sync and Pages deploy

on:
  schedule:
    - cron: "0 5 * * *"  # ~05:00 UTC, after the CEST/CET 20:00-23:00 raid block
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-commit-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - run: uv sync

      - name: Fetch latest FFLogs data
        run: uv run main.py
        env:
          FFLOGS_CLIENT_ID: ${{ secrets.FFLOGS_CLIENT_ID }}
          FFLOGS_CLIENT_SECRET: ${{ secrets.FFLOGS_CLIENT_SECRET }}

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dmu_data/pulls.csv dmu_data/reports_raw.json
          git diff --cached --quiet && echo "No data changes" || git commit -m "chore(data): nightly FFLogs sync $(date -u +%F)"
          git push

  build-and-deploy:
    needs: fetch-and-commit-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: astral-sh/setup-uv@v3

      - run: uv sync

      - run: mkdir -p site/nights

      - name: Build full-history dashboard
        run: uv run build_dashboard.py --out site/dashboard.html

      - name: Build per-night reports
        run: uv run build_night_report.py --all-nights --out-dir site/nights

      - name: Build landing page
        run: uv run build_index.py --out site/index.html --nights-dir nights

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
